name: Vercel Deploy\n\non:push:\n  branches:\n    - main\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n    - name: Checkout code\n      uses: actions/checkout@v2\n    - name: Install dependencies\n      run: npm install\n    - name: Build the project\n      run: npm run build\n    - name: Deploy to Vercel\n      run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --org ${{ secrets.VERCEL_ORG }}\n